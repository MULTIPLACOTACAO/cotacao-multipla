<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:black;
text-align:center;
padding:30px;
}

header img{
width:180px;
border-radius:20px;
}

header h1{
color:#e30613;
margin-top:10px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
}

button{
background:#e30613;
color:white;
border:none;
padding:12px;
border-radius:8px;
margin-top:5px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#ff1a1a;
}

.categoria{
background:#1c1c1c;
margin-top:20px;
padding:15px;
border-radius:10px;
}

.produto{
background:#2b2b2b;
padding:10px;
margin-top:10px;
border-radius:8px;
}

#resumo{
background:#000;
padding:20px;
margin-top:30px;
border-radius:10px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>

<img src="logo_512.png">

<h1>MULTIPLA COTAÇÃO</h1>

</header>

<div class="container">

<div id="cliente">

<input id="nome" placeholder="Nome">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">

<button onclick="iniciar()">INICIAR COTAÇÃO</button>

</div>

<div id="produtos" class="hidden"></div>

<div id="resumo" class="hidden">

<h3>Resumo da Cotação</h3>

<div id="listaResumo"></div>

<h3>Observações</h3>

<textarea id="obs" placeholder="Observações sobre o pedido"></textarea>

<br>

<button onclick="enviar()">ENVIAR NO WHATSAPP</button>

<button onclick="voltar()">VOLTAR</button>

</div>

</div>

<script>

const catalogo={

"Estribos":[
"EST001 Estribo 11x17 4.2mm",
"EST002 Estribo 12x27 4.2mm",
"EST003 Estribo 7x17 4.2mm"
],

"Argamassas":[
"ARG001 Argamassa Precon ACI",
"ARG002 Argamassa Precon ACII",
"ARG003 Argamassa Precon ACIII"
],

"Pregos":[
"PRG001 Prego Ardox 17x21",
"PRG002 Prego CCAB 12x12 Gerdau"
],

"Treliças":[
"TRL001 Treliça TR8 12M",
"TRL002 Treliça TR8 6M"
],

"Arames":[
"ARM001 Arame recozido 3.40mm",
"ARM002 Arame recozido 2.77mm"
],

"Malhas":[
"MLP001 Malha POP 10x10 4.2mm",
"MLP002 Malha POP 20x20 3.4mm"
],

"Colunas":[
"COL001 Coluna leve 6mm 12x17",
"COL002 Coluna leve 6mm 7x14"
],

"Vergalhões":[
"VRG001 Vergalhão CA60 4.2mm",
"VRG002 Vergalhão CA60 5mm"
]

};

let carrinho=[];

function iniciar(){

document.getElementById("cliente").style.display="none";

document.getElementById("produtos").classList.remove("hidden");

mostrarProdutos();

}

function mostrarProdutos(){

const area=document.getElementById("produtos");

area.innerHTML="";

for(let categoria in catalogo){

let bloco=document.createElement("div");

bloco.className="categoria";

bloco.innerHTML="<h3>"+categoria+"</h3>";

catalogo[categoria].forEach(prod=>{

let item=document.createElement("div");

item.className="produto";

item.innerHTML=`

<label>${prod}</label>

<input type="number" min="1" placeholder="Quantidade" id="${prod}">

<button onclick="adicionar('${prod}')">ADICIONAR</button>

`;

bloco.appendChild(item);

});

area.appendChild(bloco);

}

}

function adicionar(prod){

let qtd=document.getElementById(prod).value;

if(!qtd) return;

carrinho.push({produto:prod,quantidade:qtd});

atualizarResumo();

}

function atualizarResumo(){

const lista=document.getElementById("listaResumo");

lista.innerHTML="";

carrinho.forEach(item=>{

lista.innerHTML+=`<p>${item.produto} - ${item.quantidade}</p>`;

});

document.getElementById("resumo").classList.remove("hidden");

}

function enviar(){

let nome=document.getElementById("nome").value;

let cidade=document.getElementById("cidade").value;

let obs=document.getElementById("obs").value;

let mensagem="Cotação de "+nome+" ("+cidade+")%0A%0A";

carrinho.forEach(item=>{

mensagem+=item.produto+" - "+item.quantidade+"%0A";

});

mensagem+="%0AObservações:%0A"+obs;

window.open("https://wa.me/5531986580180?text="+mensagem);

}

function voltar(){

location.reload();

}

</script>

</body>
</html>
