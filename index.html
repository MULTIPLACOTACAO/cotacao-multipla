<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multipla Cotação</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e30613">

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
color:#fff;
}

header{
background:#000;
padding:25px;
text-align:center;
color:#e30613;
font-size:28px;
font-weight:700;
letter-spacing:1px;
box-shadow:0 4px 15px rgba(0,0,0,0.6);
}

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#2b2b2b;
color:#fff;
font-size:14px;
}

input:focus{
outline:none;
box-shadow:0 0 0 2px #e30613;
}

button{
background:#e30613;
color:white;
border:none;
padding:14px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
width:100%;
font-weight:bold;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#ff1a1a;
transform:scale(1.03);
}

.category{
background:#1c1c1c;
padding:20px;
margin-top:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
animation:fadeIn 0.4s ease-in-out;
}

.category h3{
margin-top:0;
color:#e30613;
border-bottom:1px solid #333;
padding-bottom:10px;
}

.product{
background:#2a2a2a;
padding:15px;
margin-top:12px;
border-radius:12px;
display:flex;
flex-direction:column;
gap:8px;
transition:0.2s;
}

.product:hover{
background:#333;
}

#cart{
background:#111;
padding:20px;
margin-top:35px;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,0.6);
}

#cart h3{
color:#e30613;
margin-top:0;
}

.badge{
background:#e30613;
padding:4px 8px;
border-radius:20px;
font-size:12px;
margin-left:8px;
}

.hidden{
display:none;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<header>
MULTIPLA COTAÇÃO
<span id="contador" class="badge hidden">0 itens</span>
</header>

<div class="container">

<div id="cliente">
<input id="nome" placeholder="Nome">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">
<button onclick="iniciar()">INICIAR COTAÇÃO</button>
</div>

<div id="produtos" class="hidden"></div>

<div id="cart" class="hidden">
<h3>Resumo da Cotação</h3>
<div id="resumo"></div>
<button onclick="enviarWhats()">ENVIAR NO WHATSAPP</button>
</div>

</div>

<script>

const catalogo = {
"Estribos":[
"EST001 - Estribo 11x17 4.2mm",
"EST002 - Estribo 12x27 4.2mm",
"EST003 - Estribo 7x17 4.2mm",
"EST004 - Estribo 17x17 4.2mm",
"EST005 - Estribo 27x27 4.2mm",
"EST006 - Estribo 7x14 4.2mm",
"EST007 - Estribo 12x27 5mm",
"EST008 - Estribo 7x14 5mm",
"EST009 - Estribo 11x17 5mm",
"EST010 - Estribo 7x17 5mm"
],

"Argamassas":[
"ARG001 - Argamassa Precon ACI Cinza",
"ARG002 - Argamassa Precon ACII Cinza",
"ARG003 - Argamassa Precon ACIII Cinza",
"ARG004 - Argamassa Porcelanato Interno",
"ARG005 - Argamassa Refratária 20kg",
"ARG006 - Argamassa Projetada 40kg",
"ARG007 - Argamassa Precon ACIII Branca"
],

"Pregos":[
"PRG001 - Prego Ardox 17x21",
"PRG002 - Prego CCAB 12x12 Gerdau",
"PRG003 - Prego CCAB 15x15 Gerdau",
"PRG004 - Prego CCAB 17x21 Gerdau",
"PRG005 - Prego CCAB 18x30 Gerdau",
"PRG006 - Prego CCAB 19x36 Gerdau",
"PRG007 - Prego 20x48 Gerdau",
"PRG008 - Prego 22x48 Gerdau",
"PRG009 - Prego 19x11 Gerdau"
],

"Treliças":[
"TRL001 - Treliça TR8-633 12m",
"TRL002 - Treliça TR8-633 6m",
"TRL003 - Treliça TR8-533 6m",
"TRL004 - Treliça TR12-644 12m",
"TRL005 - Treliça TR8-644 6m"
],

"Arames":[
"ARM001 - BOB ARAME REC 3,40MM LISO BWG10 (PG18)",
"ARM002 - BOB ARAME REC 2,77MM LISO BWG12 (PG16)",
"ARM003 - BOB ARAME REC 2,10MM LISO BWG14 (PG14)",
"ARM004 - BOB ARAME REC 1,65MM LISO BWG16 (PG12)",
"ARM005 - BOB ARAME REC 1,24 REC TORC BWG18 (PG7)",
"ARM006 - BOB ARAME REC LISO BWG18 (PG7)"
],

"Kit Arame":[
"KIT001 - Kit 10x Arame Rec 1,24mm Torcido",
"KIT002 - Kit 10x Arame Rec 1,24mm Liso",
"KIT003 - Kit 10x Arame Rec 1,65mm Liso",
"KIT004 - Kit 10x Arame Rec 2,10mm Liso"
],

"Malhas":[
"MLP001 - Malha Pop 10x10 4.2mm 2x3m",
"MLP002 - Malha Pop 20x20 3.4mm 2x3m",
"MLP003 - Malha Pop 15x15 3.4mm 2x3m",
"MLP004 - Malha Pop 15x15 4.2mm 2x3m",
"MLP005 - Malha Pop 10x10 4.2mm 2,45x6m"
],

"Colunas":[
"COL001 - Coluna Leve 6mm 12x17 6m",
"COL002 - Coluna Leve 6mm 7x14 6m",
"COL003 - Coluna Leve 6mm 7x17 6m",
"COL004 - Coluna Média 8mm 12x12 6m",
"COL005 - Coluna Média 8mm 11x17 6m"
],

"Vergalhoes":[
"VRG001 - Vergalhão CA60 4.2mm Feixe 50 Barras",
"VRG002 - Vergalhão CA60 5.0mm Feixe 35 Barras",
"VRG003 - Vergalhão CA50 6.3mm Feixe 25 Barras",
"VRG004 - Vergalhão CA50 8mm Feixe 15 Barras",
"VRG005 - Vergalhão CA50 10mm Feixe 10 Barras",
"VRG006 - Vergalhão CA50 12.5mm Feixe 6 Barras",
"VRG007 - Vergalhão CA50 16mm Feixe 3 Barras",
"VRG008 - Vergalhão CA50 20mm Feixe 3 Barras"
]
};

let carrinho = [];

function iniciar(){
document.getElementById("cliente").style.display="none";
document.getElementById("produtos").classList.remove("hidden");
gerarProdutos();
}

function gerarProdutos(){
const container=document.getElementById("produtos");
container.innerHTML="";
for(let categoria in catalogo){
let div=document.createElement("div");
div.className="category";
div.innerHTML="<h3>"+categoria+"</h3>";
catalogo[categoria].forEach(prod=>{
let p=document.createElement("div");
p.className="product";
p.innerHTML=`
<label>${prod}</label>
<input type="number" min="0" placeholder="Quantidade" onchange="addCarrinho('${prod}',this.value)">
`;
div.appendChild(p);
});
container.appendChild(div);
}
}

function addCarrinho(prod,qtd){
qtd=parseInt(qtd);
if(!qtd || qtd<=0) return;

let existente=carrinho.find(item=>item.produto===prod);
if(existente){
existente.quantidade=qtd;
}else{
carrinho.push({produto:prod,quantidade:qtd});
}
atualizarResumo();
}

function atualizarResumo(){
const resumo=document.getElementById("resumo");
const contador=document.getElementById("contador");
resumo.innerHTML="";
if(carrinho.length>0){
document.getElementById("cart").classList.remove("hidden");
contador.classList.remove("hidden");
contador.innerText=carrinho.length+" itens";
carrinho.forEach(item=>{
resumo.innerHTML+=`<p>${item.produto} - ${item.quantidade}</p>`;
});
}
}

function enviarWhats(){
let nome=document.getElementById("nome").value;
let cidade=document.getElementById("cidade").value;

let mensagem=`Olá, sou ${nome} de ${cidade}.\n\nSegue minha cotação:\n\n`;
carrinho.forEach(item=>{
mensagem+=`${item.produto} - ${item.quantidade}\n`;
});
mensagem+="\nAguardo retorno.";

let numero="5531986580180";
let url=`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
window.open(url,"_blank");
}

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
