<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

header{
background:#1a1a1a;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff2c2c;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.search{
flex:1;
padding:14px;
border-radius:10px;
border:none;
font-size:16px;
}

.buscarBtn{
width:120px;
border:none;
border-radius:10px;
background:#ff2c2c;
color:white;
font-size:16px;
cursor:pointer;
}

.gridCategorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:20px;
}

.categoria{
background:#1f1f1f;
padding:20px;
border-radius:12px;
text-align:center;
font-size:18px;
cursor:pointer;
}

.produto{
background:#1c1c1c;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

input{
width:100%;
padding:8px;
border:none;
border-radius:8px;
margin-top:5px;
}

button{
margin-top:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff2c2c;
color:white;
cursor:pointer;
}

#carrinho{
margin-top:25px;
background:#161616;
padding:15px;
border-radius:12px;
}

.itemCarrinho{
background:#222;
padding:8px;
border-radius:8px;
margin-top:6px;
display:flex;
justify-content:space-between;
}

.whatsapp{
background:#25D366;
font-size:18px;
font-weight:bold;
width:100%;
padding:14px;
border-radius:10px;
margin-top:15px;
}

.limpar{
background:#555;
margin-top:10px;
width:100%;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">

<input class="search" id="busca" placeholder="Buscar produto">

<button class="buscarBtn" onclick="buscarProduto()">Buscar</button>

</div>

<div id="categorias" class="gridCategorias"></div>

<div id="produtos" class="hidden"></div>

<div id="carrinho">

<h3>Carrinho (<span id="contador">0</span>)</h3>

<div id="listaCarrinho"></div>

<h3>Observações</h3>

<textarea id="obs"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Carrinho</button>

<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

</div>

</div>

<script>

const catalogo={

"Estribos":[
"EST001 Estribo 11x17",
"EST002 Estribo 12x27",
"EST003 Estribo 7x17"
],

"Argamassas":[
"ARG001 Argamassa ACI",
"ARG002 Argamassa ACII",
"ARG003 Argamassa ACIII"
],

"Pregos":[
"Prego 17x21",
"Prego 18x30",
"Prego 19x36"
],

"Arames":[
"Arame BWG10",
"Arame BWG12",
"Arame BWG14"
]

};

let carrinho=[];

function carregarCategorias(){

let area=document.getElementById("categorias");

area.innerHTML="";

for(let c in catalogo){

area.innerHTML+=`<div class="categoria" onclick="abrirCategoria('${c}')">${c}</div>`;

}

}

function abrirCategoria(cat){

let area=document.getElementById("produtos");

area.classList.remove("hidden");

area.innerHTML=`<h2>${cat}</h2>`;

catalogo[cat].forEach(p=>{

area.innerHTML+=`

<div class="produto">

${p}

<input type="number" placeholder="Quantidade" id="${p}">

<button onclick="add('${p}')">Adicionar</button>

</div>

`;

});

}

function add(prod){

let q=document.getElementById(prod).value;

if(!q)return;

carrinho.push(prod+" - "+q);

mostrarCarrinho();

}

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho");

lista.innerHTML="";

carrinho.forEach((i,index)=>{

lista.innerHTML+=`<div class="itemCarrinho">${i}<button onclick="remover(${index})">X</button></div>`;

});

document.getElementById("contador").innerText=carrinho.length;

}

function remover(i){

carrinho.splice(i,1);

mostrarCarrinho();

}

function limparCarrinho(){

carrinho=[];

mostrarCarrinho();

}

function enviar(){

let obs=document.getElementById("obs").value;

let msg="Cotação:%0A%0A";

carrinho.forEach(i=>{

msg+=i+"%0A";

});

msg+="%0AObservação:%0A"+obs;

window.open("https://wa.me/?text="+msg);

}

function buscarProduto(){

let termo=document.getElementById("busca").value.toLowerCase();

let area=document.getElementById("produtos");

area.classList.remove("hidden");

area.innerHTML="<h2>Resultados</h2>";

for(let cat in catalogo){

catalogo[cat].forEach(p=>{

if(p.toLowerCase().includes(termo)){

area.innerHTML+=`

<div class="produto">

${p}

<input type="number" id="${p}" placeholder="Quantidade">

<button onclick="add('${p}')">Adicionar</button>

</div>

`;

}

});

}

}

carregarCategorias();

</script>

</body>

</html>
