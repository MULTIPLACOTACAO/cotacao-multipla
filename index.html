<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.card{
background:white;
border-radius:12px;
padding:10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
cursor:pointer;
}

.card img{
width:100%;
height:90px;
object-fit:contain;
}

.card span{
font-weight:bold;
display:block;
margin-top:5px;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
}

.tabelaProdutos td{
padding:10px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

#carrinho{
background:white;
border-radius:6px;
padding:15px;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

.limpar{
margin-top:10px;
background:#7f8c8d;
color:white;
border:none;
padding:8px;
border-radius:4px;
width:100%;
}

.whatsapp{
margin-top:10px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="grid"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">
<h3>Carrinho (<span id="contador">0</span>)</h3>
<div id="listaCarrinho"></div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Pedido</button>
<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

</div>

</div>

<script>

const numero="5531986580180";

const catalogo = {
"Estribos":["EST001 - Estribo 11x17 4.2mm"],
"Argamassas":["ARG002 - Argamassa Precon ACII Cinza"],
"Pregos":["PRG001 - Prego"],
"Treliças":["TRL001 - Treliça"],
"Arames":["ARM001 - Arame"],
"Kit Arame":["KIT001 - Kit Arame"],
"Malhas":["MLP001 - Malha"],
"Colunas":["COL001 - Coluna"],
"Vergalhoes":["VRG001 - Vergalhão"]
};

const imagens = {
"Estribos":"https://i.imgur.com/2nCt3Sbl.jpg",
"Argamassas":"https://i.imgur.com/3ZQ3Z6P.png",
"Pregos":"https://i.imgur.com/Fw7QZbM.jpg",
"Treliças":"https://i.imgur.com/TkG7p3A.jpg",
"Arames":"https://i.imgur.com/BZk8R9R.jpg",
"Kit Arame":"https://i.imgur.com/6vZzQ5H.jpg",
"Malhas":"https://i.imgur.com/7L5nG1E.jpg",
"Colunas":"https://i.imgur.com/Z8xF0pX.jpg",
"Vergalhoes":"https://i.imgur.com/Hw7JvKQ.jpg"
};

let carrinho=[];

function carregarCategorias(){
let area=document.getElementById("categorias");
area.innerHTML="";

for(let c in catalogo){
area.innerHTML+=`
<div class="card" onclick="abrirCategoria('${c}')">
<img src="${imagens[c]}">
<span>${c}</span>
</div>`;
}
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>`;
});
}

function buscarProduto(){
let termo=document.getElementById("busca").value.toLowerCase();
let area=document.getElementById("produtos");
area.innerHTML="";

for(let categoria in catalogo){
catalogo[categoria].forEach(produto=>{
if(produto.toLowerCase().includes(termo)){
area.innerHTML+=`
<tr>
<td>${produto}</td>
<td><input type="number" id="${produto}"></td>
<td><button class="btnAdd" onclick="add('${produto}')">Adicionar</button></td>
</tr>`;
}
});
}
}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
mostrarCarrinho();
}

function mostrarCarrinho(){
let lista=document.getElementById("listaCarrinho");
lista.innerHTML="";
carrinho.forEach((i,index)=>{
lista.innerHTML+=`<div>${i}</div>`;
});
document.getElementById("contador").innerText=carrinho.length;
}

function limparCarrinho(){
carrinho=[];
mostrarCarrinho();
}

function enviar(){
let obs=document.getElementById("obs").value;
let msg="Cotação:%0A%0A";
carrinho.forEach(i=> msg+=i+"%0A");
msg+="%0AObs:%20"+obs;
window.open("https://wa.me/"+numero+"?text="+msg);
}

carregarCategorias();

</script>

</body>
</html>
