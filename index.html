<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* GRID DE IMAGENS */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.item{
background:white;
border-radius:10px;
padding:10px;
text-align:center;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.item img{
width:80px;
}

/* RESTO DO SISTEMA */
.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.categorias{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.categoria{
background:white;
border:1px solid #ddd;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
border-collapse:collapse;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
text-align:left;
}

.tabelaProdutos td{
padding:10px;
border-bottom:1px solid #eee;
}

.tabelaProdutos input{
width:80px;
padding:5px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

#carrinho{
background:white;
border-radius:6px;
padding:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.itemCarrinho{
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
padding:6px 0;
}

.remover{
background:#e74c3c;
color:white;
border:none;
border-radius:4px;
padding:4px 8px;
cursor:pointer;
}

.limpar{
margin-top:10px;
background:#7f8c8d;
color:white;
border:none;
padding:8px;
border-radius:4px;
width:100%;
cursor:pointer;
}

.whatsapp{
margin-top:10px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
cursor:pointer;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<!-- IMAGENS NO TOPO -->
<div class="grid">

<div class="item" onclick="abrirCategoria('Treliças')"><img src="img/trelica.png"><p>Treliça</p></div>
<div class="item" onclick="abrirCategoria('Arames')"><img src="img/arame.png"><p>Arame</p></div>
<div class="item" onclick="abrirCategoria('Kit Arame')"><img src="img/kit_arame.png"><p>Kit Arame</p></div>
<div class="item" onclick="abrirCategoria('Malhas')"><img src="img/malha_pop.png"><p>Malha Pop</p></div>
<div class="item" onclick="abrirCategoria('Colunas')"><img src="img/coluna.png"><p>Coluna</p></div>
<div class="item" onclick="abrirCategoria('Estribos')"><img src="img/estribo.png"><p>Estribo</p></div>
<div class="item" onclick="abrirCategoria('Vergalhoes')"><img src="img/vergalhoes.png"><p>Vergalhão</p></div>
<div class="item" onclick="abrirCategoria('Argamassas')"><img src="img/argamassa.png"><p>Argamassa</p></div>
<div class="item" onclick="abrirCategoria('Pregos')"><img src="img/pregos.png"><p>Pregos</p></div>

</div>

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="categorias"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">

<h3>Carrinho (<span id="contador">0</span>)</h3>

<div id="listaCarrinho"></div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Pedido</button>

<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

</div>

</div>

<script>

const numero="5531986580180";

/* SEU CATÁLOGO COMPLETO */
const catalogo = {
"Estribos":[
"EST001 - Estribo 11x17 4.2mm","EST002 - Estribo 12x27 4.2mm","EST003 - Estribo 7x17 4.2mm","EST004 - Estribo 17x17 4.2mm","EST005 - Estribo 27x27 4.2mm","EST006 - Estribo 7x14 4.2mm","EST007 - Estribo 12x27 5mm","EST008 - Estribo 7x14 5mm","EST009 - Estribo 11x17 5mm","EST010 - Estribo 7x17 5mm"
],
"Argamassas":[
"ARG001 - Argamassa Precon ACI Cinza","ARG002 - Argamassa Precon ACII Cinza","ARG003 - Argamassa Precon ACIII Cinza","ARG004 - Argamassa Porcelanato Interno","ARG005 - Argamassa Refratária 20kg","ARG006 - Argamassa Projetada 40kg","ARG007 - Argamassa Precon ACIII Branca"
],
"Pregos":[
"PRG001 - Prego Ardox SC 17x21 2x11","PRG002 - Prego CCAB 12x12 Gerdau","PRG003 - Prego CCAB 15x15 Gerdau","PRG004 - Prego CCAB 17x21 Gerdau","PRG005 - Prego CCAB 18x30 Gerdau","PRG006 - Prego 19x36 Gerdau","PRG007 - Prego 20x48 Gerdau","PRG008 - Prego 22x48 Gerdau","PRG009 - Prego 19x11 Gerdau"
],
"Treliças":[
"TRL001 - Treliça TR8 12M","TRL002 - Treliça TR8 6M","TRL003 - Treliça TR12 6M","TRL004 - Treliça TR8 leve","TRL005 - Treliça TR12 12M","TRL006 - Treliça TR8 pesada"
],
"Arames":[
"ARM001 - Arame BWG10","ARM002 - Arame BWG12","ARM003 - Arame BWG14","ARM004 - Arame BWG16","ARM005 - Arame BWG18 Torcido","ARM006 - Arame BWG18 Liso"
],
"Kit Arame":[
"KIT001 - Kit Arame 10x BWG18","KIT002 - Kit Arame 10x Liso","KIT003 - Kit Arame 10x BWG16","KIT004 - Kit Arame 10x BWG14","KIT005 - Kit Arame 10x BWG12","KIT006 - Kit Arame 10x BWG10"
],
"Malhas":[
"MLP001 - Malha Pop 10x10","MLP002 - Malha Pop 20x20","MLP003 - Malha Pop 15x15","MLP004 - Malha Pop 15x15 reforçada","MLP005 - Malha Pop 10x10 6m"
],
"Colunas":[
"COL001 - Coluna 6mm","COL002 - Coluna 6mm 7x14","COL003 - Coluna 6mm 7x17","COL004 - Coluna 8mm","COL005 - Coluna 8mm reforçada","COL006 - Coluna 8mm 7x14","COL007 - Coluna 8mm 7x17","COL008 - Coluna 10mm","COL009 - Coluna 10mm 7x14","COL010 - Coluna 10mm 7x17"
],
"Vergalhoes":[
"VRG001 - Vergalhão 4.2","VRG002 - Vergalhão 5mm","VRG003 - Vergalhão 6.3","VRG004 - Vergalhão 8mm","VRG005 - Vergalhão 10mm","VRG006 - Vergalhão 12.5","VRG007 - Vergalhão 16mm","VRG008 - Vergalhão 20mm"
]
};

let carrinho=[];

function carregarCategorias(){
let area=document.getElementById("categorias");
for(let c in catalogo){
area.innerHTML+=`<div class="categoria" onclick="abrirCategoria('${c}')">${c}</div>`;
}
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>`;
});
}

function buscarProduto(){
let termo=document.getElementById("busca").value.toLowerCase();
let area=document.getElementById("produtos");
area.innerHTML="";
for(let c in catalogo){
catalogo[c].forEach(p=>{
if(p.toLowerCase().includes(termo)){
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>`;
}
});
}
}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
mostrarCarrinho();
}

function mostrarCarrinho(){
let lista=document.getElementById("listaCarrinho");
lista.innerHTML="";
carrinho.forEach((i,index)=>{
lista.innerHTML+=`<div class="itemCarrinho">${i}<button class="remover" onclick="remover(${index})">X</button></div>`;
});
document.getElementById("contador").innerText=carrinho.length;
}

function remover(i){
carrinho.splice(i,1);
mostrarCarrinho();
}

function limparCarrinho(){
carrinho=[];
mostrarCarrinho();
}

function enviar(){
let obs=document.getElementById("obs").value;
let msg="Cotação:%0A%0A";
carrinho.forEach(i=>{msg+=i+"%0A";});
msg+="%0AObservação:%0A"+obs;
window.open("https://wa.me/"+numero+"?text="+msg);
}

carregarCategorias();

</script>

</body>
</html>
