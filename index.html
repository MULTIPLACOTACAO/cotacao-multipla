<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
}

.categorias{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.categoria{
background:white;
border-radius:12px;
padding:10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
cursor:pointer;
}

.categoria img{
width:100%;
height:80px;
object-fit:contain;
}

.tabelaProdutos{
background:white;
border-radius:6px;
margin-bottom:20px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
}

.whatsapp{
background:#25D366;
color:white;
padding:12px;
width:100%;
margin-top:10px;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">
<input id="busca" placeholder="Buscar produto">
<button>Buscar</button>
</div>

<div class="categorias">

<div class="categoria"><img src="https://images.unsplash.com/photo-1581091870627-3b6f1c3c6c0f"><div>Estribos</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"><div>Argamassas</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581091215367-59ab6b6a6c9b"><div>Pregos</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0"><div>Treliças</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581091215367-59ab6b6a6c9b"><div>Arames</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0"><div>Kit Arame</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"><div>Malhas</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581091870627-3b6f1c3c6c0f"><div>Colunas</div></div>

<div class="categoria"><img src="https://images.unsplash.com/photo-1581091215367-59ab6b6a6c9b"><div>Vergalhões</div></div>

</div>

</div>

</body>
</html>
