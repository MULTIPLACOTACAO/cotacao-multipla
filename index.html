<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* GRID COM IMAGENS */
.categorias{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.categoria{
background:white;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
transition:0.2s;
}

.categoria:hover{
transform:scale(1.05);
}

.categoria img{
width:100%;
height:90px;
object-fit:contain;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
border-collapse:collapse;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
}

.tabelaProdutos td{
padding:10px;
border-bottom:1px solid #eee;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

#carrinho{
background:white;
border-radius:6px;
padding:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.itemCarrinho{
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
padding:6px 0;
}

.remover{
background:#e74c3c;
color:white;
border:none;
border-radius:4px;
padding:4px 8px;
cursor:pointer;
}

.limpar{
margin-top:10px;
background:#7f8c8d;
color:white;
border:none;
padding:8px;
border-radius:4px;
width:100%;
}

.whatsapp{
margin-top:10px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
}

.install{
margin-top:10px;
background:#ff9800;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

</style>
</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="categorias"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">

<h3>Carrinho (<span id="contador">0</span>)</h3>

<div id="listaCarrinho"></div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Pedido</button>

<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

<button id="installBtn" class="install" style="display:none">Baixar App</button>

</div>

</div>

<script>

const numero="5531986580180";

/* IMAGENS VIA LINK (NÃO VAI DAR ERRO) */
const imagens = {
"Estribos":"https://i.imgur.com/8Km9tLL.png",
"Argamassas":"https://i.imgur.com/your-precon-image.png",
"Pregos":"https://i.imgur.com/W1kQ9ZP.png",
"Treliças":"https://i.imgur.com/oYiTqum.png",
"Arames":"https://i.imgur.com/2p8pP4R.png",
"Kit Arame":"https://i.imgur.com/8kqQX9D.png",
"Malhas":"https://i.imgur.com/7rlZK0M.png",
"Colunas":"https://i.imgur.com/4Xz7k9T.png",
"Vergalhoes":"https://i.imgur.com/5X8kYzL.png"
};

const catalogo = {
"Estribos":[
"EST001 - Estribo 11x17 4.2mm","EST002 - Estribo 12x27 4.2mm","EST003 - Estribo 7x17 4.2mm","EST004 - Estribo 17x17 4.2mm","EST005 - Estribo 27x27 4.2mm","EST006 - Estribo 7x14 4.2mm","EST007 - Estribo 12x27 5mm","EST008 - Estribo 7x14 5mm","EST009 - Estribo 11x17 5mm","EST010 - Estribo 7x17 5mm"
],
"Argamassas":[
"ARG001 - Argamassa Precon ACI Cinza","ARG002 - Argamassa Precon ACII Cinza","ARG003 - Argamassa Precon ACIII Cinza","ARG004 - Argamassa Porcelanato Interno","ARG005 - Argamassa Refratária 20kg","ARG006 - Argamassa Projetada 40kg","ARG007 - Argamassa Precon ACIII Branca"
],
"Pregos":[
"PRG001 - Prego Ardox SC 17x21 2x11","PRG002 - Prego CCAB 12x12 Gerdau","PRG003 - Prego CCAB 15x15 1.1/4x13 Gerdau","PRG004 - Prego CCAB 17x21 2x11 Gerdau","PRG005 - Prego CCAB 18x30 2.3/4x10 Gerdau","PRG006 - Prego CCAB 19x36 Gerdau","PRG007 - Prego 20x48 Gerdau","PRG008 - Prego 22x48 Gerdau","PRG009 - Prego 19x11 Gerdau"
],
"Treliças":[
"TRL001 - Treliça Média TR8-633 12M","TRL002 - Treliça Média TR8-633 6M","TRL003 - Treliça Pesada TR12-644 6M","TRL004 - Treliça Leve TR8-533 6M","TRL005 - Treliça Média TR12-644 12M","TRL006 - Treliça Pesada TR8-644 6M"
],
"Arames":[
"ARM001 - BOB ARAME REC 3,40MM","ARM002 - BOB ARAME REC 2,77MM","ARM003 - BOB ARAME REC 2,10MM","ARM004 - BOB ARAME REC 1,65MM","ARM005 - BOB ARAME REC 1,24","ARM006 - BOB ARAME REC LISO"
],
"Kit Arame":[
"KIT001 - KIT 10X ARAME","KIT002 - KIT 10X ARAME","KIT003 - KIT 10X ARAME","KIT004 - KIT 10X ARAME","KIT005 - KIT 10X ARAME","KIT006 - KIT 10X ARAME"
],
"Malhas":[
"MLP001 - MALHA POP 10X10 4.2MM","MLP002 - MALHA POP 20X20","MLP003 - MALHA POP 15X15","MLP004 - MALHA POP 15X15 4.2MM","MLP005 - MALHA POP 10X10 2,45X6M"
],
"Colunas":[
"COL001 - COLUNA LEVE","COL002 - COLUNA LEVE","COL003 - COLUNA LEVE","COL004 - COLUNA MEDIA","COL005 - COLUNA MEDIA","COL006 - COLUNA MEDIA","COL007 - COLUNA MEDIA","COL008 - COLUNA PESADA","COL009 - COLUNA PESADA","COL010 - COLUNA PESADA"
],
"Vergalhoes":[
"VRG001 - Vergalhão CA60","VRG002 - Vergalhão CA60","VRG003 - Vergalhão CA50","VRG004 - Vergalhão CA50","VRG005 - Vergalhão CA50","VRG006 - Vergalhão CA50","VRG007 - Vergalhão CA50","VRG008 - Vergalhão CA50"
]
};

let carrinho=[];

function carregarCategorias(){
let area=document.getElementById("categorias");
area.innerHTML="";
for(let c in catalogo){
area.innerHTML+=`
<div class="categoria" onclick="abrirCategoria('${c}')">
<img src="${imagens[c]}">
<div>${c}</div>
</div>`;
}
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>`;
});
}

function buscarProduto(){
let termo=document.getElementById("busca").value.toLowerCase();
let area=document.getElementById("produtos");
area.innerHTML="";
for(let categoria in catalogo){
catalogo[categoria].forEach(produto=>{
if(produto.toLowerCase().includes(termo)){
area.innerHTML+=`
<tr>
<td>${produto}</td>
<td><input type="number" id="${produto}"></td>
<td><button class="btnAdd" onclick="add('${produto}')">Adicionar</button></td>
</tr>`;
}
});
}
}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
mostrarCarrinho();
}

function mostrarCarrinho(){
let lista=document.getElementById("listaCarrinho");
lista.innerHTML="";
carrinho.forEach((i,index)=>{
lista.innerHTML+=`<div class="itemCarrinho">${i}<button class="remover" onclick="remover(${index})">X</button></div>`;
});
document.getElementById("contador").innerText=carrinho.length;
}

function remover(i){
carrinho.splice(i,1);
mostrarCarrinho();
}

function limparCarrinho(){
carrinho=[];
mostrarCarrinho();
}

function enviar(){
let obs=document.getElementById("obs").value;
let msg="Cotação:%0A%0A";
carrinho.forEach(i=>{ msg+=i+"%0A"; });
msg+="%0AObservação:%0A"+obs;
window.open("https://wa.me/"+numero+"?text="+msg);
}

carregarCategorias();

</script>

</body>
</html>
