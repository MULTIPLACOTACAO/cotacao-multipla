<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
object-fit:contain;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* 🔥 NOVO LAYOUT COM IMAGENS */
.categorias{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.categoria{
background:white;
border-radius:12px;
padding:10px;
cursor:pointer;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
transition:0.2s;
}

.categoria:hover{
transform:scale(1.03);
}

.categoria img{
width:100%;
height:80px;
object-fit:contain;
}

.categoria span{
display:block;
margin-top:5px;
font-weight:bold;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
border-collapse:collapse;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
text-align:left;
}

.tabelaProdutos td{
padding:10px;
border-bottom:1px solid #eee;
}

.tabelaProdutos input{
width:80px;
padding:5px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

#carrinho{
background:white;
border-radius:6px;
padding:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.itemCarrinho{
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
padding:6px 0;
}

.remover{
background:#e74c3c;
color:white;
border:none;
border-radius:4px;
padding:4px 8px;
cursor:pointer;
}

.limpar{
margin-top:10px;
background:#7f8c8d;
color:white;
border:none;
padding:8px;
border-radius:4px;
width:100%;
cursor:pointer;
}

.whatsapp{
margin-top:10px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
cursor:pointer;
}

.install{
margin-top:10px;
background:#ff9800;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
cursor:pointer;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="categorias"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">

<h3>Carrinho (<span id="contador">0</span>)</h3>

<div id="listaCarrinho"></div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Pedido</button>

<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

<button id="installBtn" class="install" style="display:none">Baixar App</button>

</div>

</div>

<script>

const numero="5531986580180";

const catalogo = {

"Estribos":[
"EST001 - Estribo 11x17 4.2mm"
],

"Argamassas":[
"ARG002 - Argamassa Precon ACII Cinza"
],

"Pregos":[
"PRG001 - Prego"
],

"Treliças":[
"TRL001 - Treliça"
],

"Arames":[
"ARM001 - Arame"
],

"Kit Arame":[
"KIT001 - Kit Arame"
],

"Malhas":[
"MLP001 - Malha"
],

"Colunas":[
"COL001 - Coluna"
],

"Vergalhoes":[
"VRG001 - Vergalhão"
]

};

let carrinho=[];

/* 🔥 AQUI ESTÁ O SEGREDO — IMAGENS CERTAS */
function carregarCategorias(){
let area=document.getElementById("categorias");

area.innerHTML=`

<div class="categoria" onclick="abrirCategoria('Estribos')">
<img src="estribos.png">
<span>Estribos</span>
</div>

<div class="categoria" onclick="abrirCategoria('Argamassas')">
<img src="argamassa.png">
<span>Argamassas</span>
</div>

<div class="categoria" onclick="abrirCategoria('Pregos')">
<img src="pregos.png">
<span>Pregos</span>
</div>

<div class="categoria" onclick="abrirCategoria('Treliças')">
<img src="trelicas.png">
<span>Treliças</span>
</div>

<div class="categoria" onclick="abrirCategoria('Arames')">
<img src="arames.png">
<span>Arames</span>
</div>

<div class="categoria" onclick="abrirCategoria('Kit Arame')">
<img src="kit-arame.png">
<span>Kit Arame</span>
</div>

<div class="categoria" onclick="abrirCategoria('Malhas')">
<img src="malhas.png">
<span>Malhas</span>
</div>

<div class="categoria" onclick="abrirCategoria('Colunas')">
<img src="colunas.png">
<span>Colunas</span>
</div>

<div class="categoria" onclick="abrirCategoria('Vergalhoes')">
<img src="vergalhoes.png">
<span>Vergalhões</span>
</div>

`;
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>
`;
});
}

function buscarProduto(){
let termo=document.getElementById("busca").value.toLowerCase();
let area=document.getElementById("produtos");
area.innerHTML="";

for(let categoria in catalogo){
catalogo[categoria].forEach(produto=>{
if(produto.toLowerCase().includes(termo)){
area.innerHTML+=`
<tr>
<td>${produto}</td>
<td><input type="number" id="${produto}"></td>
<td><button class="btnAdd" onclick="add('${produto}')">Adicionar</button></td>
</tr>
`;
}
});
}
}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
mostrarCarrinho();
}

function mostrarCarrinho(){
let lista=document.getElementById("listaCarrinho");
lista.innerHTML="";
carrinho.forEach((i,index)=>{
lista.innerHTML+=`<div class="itemCarrinho">${i}</div>`;
});
document.getElementById("contador").innerText=carrinho.length;
}

function limparCarrinho(){
carrinho=[];
mostrarCarrinho();
}

function enviar(){
let obs=document.getElementById("obs").value;
let msg="Cotação:%0A%0A";
carrinho.forEach(i=>{ msg+=i+"%0A"; });
msg+="%0AObservação:%0A"+obs;
window.open("https://wa.me/"+numero+"?text="+msg);
}

carregarCategorias();

</script>

</body>
</html>
