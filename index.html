<script>

};

let carrinho=[];
let orcamentoInterno = [];
let clientes = JSON.parse(localStorage.getItem("clientesCRM")) || [];

function abrirCRM(){

let senha = prompt("Digite sua senha:");

if(senha !== "hot#"){
alert("Senha incorreta");
return;
}

document.getElementById("crmArea").style.display = "block";
carregarProdutosOrcamento();
mostrarClientes();

}

function salvarCliente(){

let cliente = {

tipo: document.getElementById("tipoCliente").value,

nomeFantasia: document.getElementById("nomeFantasia").value,

razaoSocial: document.getElementById("razaoSocial").value,

cpfCnpj: document.getElementById("cpfCnpj").value,

comprador: document.getElementById("comprador").value,

telefone: document.getElementById("telefoneCliente").value,

email: document.getElementById("emailCliente").value,

estado: document.getElementById("estadoCliente").value,

endereco: document.getElementById("enderecoCliente").value,

bairro: document.getElementById("bairroCliente").value,

cep: document.getElementById("cepCliente").value,

cidade: document.getElementById("cidadeCliente").value,

grupo: document.getElementById("grupoCliente").value,

classificacao: document.getElementById("classificacao").value,

compraDesde: document.getElementById("compraDesde").value,

obs: document.getElementById("obsCliente").value

};

clientes.push(cliente);

localStorage.setItem(
"clientesCRM",
JSON.stringify(clientes)
);

mostrarClientes();

limparCampos();

}

function mostrarClientes(){

let area = document.getElementById("listaClientes");

let filtro = document
.getElementById("pesquisaCliente")
.value
.toLowerCase();

area.innerHTML = "";

let clientesFiltrados = clientes.filter(c => {

let textoBusca = `
${c.nomeFantasia}
${c.razaoSocial}
${c.cpfCnpj}
${c.telefone}
${c.email}
${c.estado}
${c.cidade}
${c.grupo}
${c.concorrentePrincipal || ""}
${c.outrosConcorrentes || ""}
`.toLowerCase();

return textoBusca.includes(filtro);

});

area.innerHTML = `

<div style="overflow-x:auto;">

<table style="
width:100%;
border-collapse:collapse;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
">

<thead>

<tr style="
background:#2c3e50;
color:white;
">

<th style="padding:12px">Cliente</th>
<th style="padding:12px">Cidade</th>
<th style="padding:12px">WhatsApp</th>
<th style="padding:12px">Grupo</th>
<th style="padding:12px">Concorrente</th>
<th style="padding:12px">Classificação</th>
<th style="padding:12px">Ações</th>

</tr>

</thead>

<tbody>

${clientesFiltrados.map((c,index)=>`

<tr style="border-bottom:1px solid #eee;">

<td style="padding:12px">

<b>${c.nomeFantasia}</b><br>

<small>${c.razaoSocial}</small><br>

<small>${c.cpfCnpj}</small>

</td>

<td style="padding:12px">

${c.cidade} - ${c.estado}

</td>

<td style="padding:12px">

<a href="https://wa.me/${c.telefone}" target="_blank">

${c.telefone}

</a>

</td>

<td style="padding:12px">

${c.grupo}

</td>

<td style="padding:12px">

${c.concorrentePrincipal || "-"}

</td>

<td style="padding:12px">

${c.classificacao}

</td>

<td style="padding:12px">

<button onclick="editarCliente(${index})"
style="
background:#f39c12;
color:white;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
margin-bottom:5px;
">

Editar

</button>

<br>

<button onclick="removerCliente(${index})"
style="
background:#e74c3c;
color:white;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
">

Remover

</button>

</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`;

}


function editarCliente(index){

let c = clientes[index];

document.getElementById("tipoCliente").value = c.tipo;

document.getElementById("nomeFantasia").value = c.nomeFantasia;

document.getElementById("razaoSocial").value = c.razaoSocial;

document.getElementById("cpfCnpj").value = c.cpfCnpj;

document.getElementById("comprador").value = c.comprador;

document.getElementById("telefoneCliente").value = c.telefone;

document.getElementById("emailCliente").value = c.email;

document.getElementById("estadoCliente").value = c.estado;

document.getElementById("cidadeCliente").value = c.cidade;

document.getElementById("grupoCliente").value = c.grupo;

document.getElementById("classificacao").value = c.classificacao;

document.getElementById("compraDesde").value = c.compraDesde;

document.getElementById("obsCliente").value = c.obs;

clientes.splice(index,1);

localStorage.setItem(
"clientesCRM",
JSON.stringify(clientes)
);

mostrarClientes();

}

function removerCliente(index){

clientes.splice(index,1);

localStorage.setItem(
"clientesCRM",
JSON.stringify(clientes)
);

mostrarClientes();

}

function limparCampos(){

document.getElementById("nomeFantasia").value = "";

document.getElementById("razaoSocial").value = "";

document.getElementById("cpfCnpj").value = "";

document.getElementById("comprador").value = "";

document.getElementById("telefoneCliente").value = "";

document.getElementById("emailCliente").value = "";

document.getElementById("estadoCliente").value = "";

document.getElementById("cidadeCliente").value = "";

document.getElementById("grupoCliente").value = "";

document.getElementById("compraDesde").value = "";

document.getElementById("obsCliente").value = "";

}

function carregarCategorias(){

let area=document.getElementById("categorias");

area.innerHTML="";

for(let c in catalogo){

area.innerHTML += `
<div class="categoria" onclick="abrirCategoria('${c}')">
${c}
</div>
`;

}

}

function abrirCategoria(cat){

let area=document.getElementById("produtos");

area.innerHTML="";

catalogo[cat].forEach(p=>{

area.innerHTML += `
<tr>

<td>${p}</td>

<td>
<input type="number" id="${p}">
</td>

<td>
<button class="btnAdd" onclick="add('${p}')">
Adicionar
</button>
</td>

</tr>
`;

});

}

function buscarProduto(){

let termo=document
.getElementById("busca")
.value
.toLowerCase();

let area=document.getElementById("produtos");

area.innerHTML="";

for(let categoria in catalogo){

catalogo[categoria].forEach(produto=>{

if(produto.toLowerCase().includes(termo)){

area.innerHTML += `
<tr>

<td>${produto}</td>

<td>
<input type="number" id="${produto}">
</td>

<td>
<button class="btnAdd" onclick="add('${produto}')">
Adicionar
</button>
</td>

</tr>
`;

}

});

}

}

function add(prod){

let q=document.getElementById(prod).value;

if(!q)return;

carrinho.push(prod+" - "+q);

mostrarCarrinho();

}

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho");

lista.innerHTML="";

carrinho.forEach((i,index)=>{

lista.innerHTML += `
<div class="itemCarrinho">

${i}

<button class="remover" onclick="remover(${index})">
X
</button>

</div>
`;

});

document.getElementById("contador").innerText=carrinho.length;

}

function remover(i){

carrinho.splice(i,1);

mostrarCarrinho();

}

function limparCarrinho(){

carrinho=[];

mostrarCarrinho();

}

function enviar(){

let obs=document.getElementById("obs").value;

let msg="Cotação:%0A%0A";

carrinho.forEach(i=>{

msg += i+"%0A";

});

msg += "%0AObservação:%0A"+obs;

window.open(
"https://wa.me/"+numero+"?text="+msg
);

}
function adicionarOrcamento(produto){

let qtd = prompt("Quantidade:");

if(!qtd) return;

let preco = prompt("Preço Unitário:");

if(!preco) return;

preco = parseFloat(preco);

let total = qtd * preco;

orcamentoInterno.push({
produto,
qtd,
preco,
total
});

mostrarOrcamento();

}

function mostrarOrcamento(){

let area = document.getElementById("orcamentoArea");

area.innerHTML = "";

let totalGeral = 0;

orcamentoInterno.forEach((item,index)=>{

totalGeral += item.total;

area.innerHTML += `

<div style="
background:white;
padding:15px;
