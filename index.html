<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multipla Cotação</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e30613">

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
color:#fff;
}

header{
background:#000;
padding:25px;
text-align:center;
color:#e30613;
font-size:28px;
font-weight:700;
letter-spacing:1px;
box-shadow:0 4px 15px rgba(0,0,0,0.6);
}

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#2b2b2b;
color:#fff;
font-size:14px;
}

input:focus{
outline:none;
box-shadow:0 0 0 2px #e30613;
}

button{
background:#e30613;
color:white;
border:none;
padding:14px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
width:100%;
font-weight:bold;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#ff1a1a;
transform:scale(1.03);
}

.category{
background:#1c1c1c;
padding:20px;
margin-top:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
animation:fadeIn 0.4s ease-in-out;
}

.category h3{
margin-top:0;
color:#e30613;
border-bottom:1px solid #333;
padding-bottom:10px;
}

.product{
background:#2a2a2a;
padding:15px;
margin-top:12px;
border-radius:12px;
display:flex;
flex-direction:column;
gap:8px;
transition:0.2s;
}

.product:hover{
background:#333;
}

#cart{
background:#111;
padding:20px;
margin-top:35px;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,0.6);
}

#cart h3{
color:#e30613;
margin-top:0;
}

.badge{
background:#e30613;
padding:4px 8px;
border-radius:20px;
font-size:12px;
margin-left:8px;
}

.hidden{
display:none;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<header>
MULTIPLA COTAÇÃO
<span id="contador" class="badge hidden">0 itens</span>
</header>

<div class="container">

<div id="cliente">
<input id="nome" placeholder="Nome">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">
<button onclick="iniciar()">INICIAR COTAÇÃO</button>
</div>

<div id="produtos" class="hidden"></div>

<div id="cart" class="hidden">

<h3>Resumo da Cotação</h3>

<div id="resumo"></div>


  <h3>Observações do Pedido</h3>

<textarea id="observacoes" placeholder="Digite observações do pedido"
style="width:100%;height:120px;padding:10px;border-radius:8px;"></textarea>

<br><br>

<label>
<input type="checkbox" id="projeto">
Tenho projeto estrutural
</label>

<br><br>

<input type="file" id="arquivoProjeto" accept=".pdf,image/*">

<br><br>

<button onclick="enviarWhats()">ENVIAR NO WHATSAPP</button>
</div>

</div>

<script>

const catalogo = {

],

],

"Pregos":[

"PRG004 - Prego CCAB 17x21 2x11 Gerdau",
"PRG005 - Prego CCAB 18x30 2.3/4x10 Gerdau",
"PRG006 - Prego CCAB 19x36 Gerdau",

"PRG008 - Prego 22x48 Gerdau",
"PRG009 - Prego 19x11 Gerdau"
],

"Treliças":[

"TRL002 - Treliça Média TR8-633 6M",

"TRL005 - Treliça Média TR12-644 12M",
"TRL006 - Treliça Pesada TR8-644 6M"
],

"Arames":[

"ARM002 - BOB ARAME REC 2,77MM LISO BWG12 (PG16)",
"ARM003 - BOB ARAME REC 2,10MM LISO BWG14 (PG14)",
"ARM004 - BOB ARAME REC 1,65MM LISO BWG16 (PG12)",
"ARM005 - BOB ARAME REC 1,24 REC TORC BWG18 (PG7)",
"ARM006 - BOB ARAME REC LISO BWG18 (PG7)"
],

"Kit Arame":[
"KIT001 - KIT 10X ARAME REC 1,24MM TORC BWG18 (PG7)",
"KIT002 - KIT 10X ARAME REC 1,24 LISO BWG18 (PG7)",
"KIT003 - KIT 10X ARAME REC 1,65 LISO BWG16 (PG12)",
"KIT004 - KIT 10X ARAME REC 2,10MM LISO BWG14 (PG14)",
"KIT005 - KIT 10X ARAME REC 2,77MM LISO BWG12 (PG16)",
"KIT006 - KIT 10X ARAME REC 3,40MM LISO BWG10 (PG18)"
],

"Malhas":[
"MLP001 - MALHA POP 10X10 4.2MM 2X3M",
"MLP002 - MALHA POP 20X20 3.4MM 2X3M",
"MLP003 - MALHA POP 15X15 3.4MM 2X3M",
"MLP004 - MALHA POP 15X15 4.2MM 2X3M",
"MLP005 - MALHA POP 10X10 4.2MM 2,45X6M"
],

"Colunas":[
"COL001 - COLUNA LEVE 6MM 12X17X25CM 6M",
"COL002 - COLUNA LEVE 6MM 7X14X25CM 6M",
"COL003 - COLUNA LEVE 6MM 7X17X25CM 6M",
"COL004 - COLUNA MEDIA 8MM 12X12X25CM 6M",
"COL005 - COLUNA MEDIA 8MM 11X17X25CM 6M",
"COL006 - COLUNA MEDIA 8MM 7X14X25CM 6M",
"COL007 - COLUNA MEDIA 8MM 7X17X25CM 6M",
"COL008 - COLUNA PESADA 10MM 11X17X25CM 6M",
"COL009 - COLUNA PESADA 10MM 7X14X25CM 6M",
"COL010 - COLUNA PESADA 10MM 7X17X25CM 6M"
],

"Vergalhoes":[
"VRG001 - Vergalhão CA60 4.2MM Feixe 50 Barras",
"VRG002 - Vergalhão CA60 5MM Feixe 35 Barras",
"VRG003 - Vergalhão CA50 6.3MM Feixe 25 Barras",
"VRG004 - Vergalhão CA50 8MM Feixe 15 Barras",
"VRG005 - Vergalhão CA50 10MM Feixe 10 Barras",
"VRG006 - Vergalhão CA50 12.5MM Feixe 6 Barras",
"VRG007 - Vergalhão CA50 16MM Feixe 3 Barras",
"VRG008 - Vergalhão CA50 20MM Feixe 3 Barras"
]
};

let carrinho = [];

function iniciar(){
document.getElementById("cliente").style.display="none";
document.getElementById("produtos").classList.remove("hidden");
gerarProdutos();
}

function gerarProdutos(){
const container=document.getElementById("produtos");
container.innerHTML="";
for(let categoria in catalogo){
let div=document.createElement("div");
div.className="category";
div.innerHTML="<h3>"+categoria+"</h3>";
catalogo[categoria].forEach(prod=>{
let p=document.createElement("div");
p.className="product";
p.innerHTML=`
<label>${prod}</label>
<input type="number" min="0" placeholder="Quantidade" onchange="addCarrinho('${prod}',this.value)">
`;
div.appendChild(p);
});
container.appendChild(div);
}
}

function addCarrinho(prod,qtd){
qtd=parseInt(qtd);
if(!qtd || qtd<=0) return;

let existente=carrinho.find(item=>item.produto===prod);
if(existente){
existente.quantidade=qtd;
}else{
carrinho.push({produto:prod,quantidade:qtd});
}
atualizarResumo();
}

function atualizarResumo(){
const resumo=document.getElementById("resumo");
const contador=document.getElementById("contador");
resumo.innerHTML="";
if(carrinho.length>0){
document.getElementById("cart").classList.remove("hidden");
contador.classList.remove("hidden");
contador.innerText=carrinho.length+" itens";
carrinho.forEach(item=>{
resumo.innerHTML+=`<p>${item.produto} - ${item.quantidade}</p>`;
});
}
}

function enviarWhats(){

let nome=document.getElementById("nome").value;
let cidade=document.getElementById("cidade").value;

let observacoes=document.getElementById("observacoes").value;
let projeto=document.getElementById("projeto").checked ? "Sim" : "Não";

let mensagem=`Olá, sou ${nome} de ${cidade}.\n\n`;
mensagem+="Segue minha cotação:\n\n";

carrinho.forEach(item=>{
mensagem+=`${item.produto} - ${item.quantidade}\n`;
});

mensagem+="\nObservações do pedido:\n"+observacoes+"\n";
mensagem+="Projeto estrutural: "+projeto+"\n\n";

mensagem+="Aguardo retorno.";

let numero="5531986580180";

let url=`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(url,"_blank");

}

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>  

</body>
</html>
