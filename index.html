<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:black;
text-align:center;
padding:25px;
}

header img{
width:100%;
max-width:600px;
}

header h1{
color:#ff2c2c;
margin-top:10px;
font-size:28px;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:15px;
}

.search{
flex:1;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.buscarBtn{
width:120px;
background:#e30613;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:10px;
background:#e30613;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#ff2c2c;
}

.categoria{
background:#1f1f1f;
margin-top:10px;
font-size:18px;
}

.produto{
background:#222;
padding:10px;
border-radius:10px;
margin-top:10px;
}

input{
width:100%;
padding:8px;
border-radius:8px;
border:none;
margin-top:5px;
}

textarea{
width:100%;
padding:10px;
border-radius:8px;
border:none;
}

#carrinho{
background:black;
padding:15px;
border-radius:12px;
margin-top:20px;
}

.carrinhoItem{
background:#1c1c1c;
padding:8px;
border-radius:8px;
margin-top:5px;
}

.whatsapp{
background:#25D366;
font-weight:bold;
font-size:18px;
}

.contador{
background:#e30613;
padding:4px 8px;
border-radius:10px;
margin-left:5px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>

<img src="logo_512.png">

<h1>MULTIPLA COTAÇÃO</h1>

</header>

<div class="container">

<div class="searchBox">

<input class="search" id="busca" placeholder="🔎 Buscar produto...">

<button class="buscarBtn" onclick="buscarProduto()">Buscar</button>

</div>

<div id="categorias"></div>

<div id="produtos" class="hidden"></div>

<div id="carrinho">

<h3>Carrinho <span id="contador" class="contador">0</span></h3>

<div id="listaCarrinho"></div>

<h3>Observações</h3>

<textarea id="obs"></textarea>

<button class="whatsapp" onclick="enviar()">📲 ENVIAR COTAÇÃO NO WHATSAPP</button>

</div>

</div>

<script>

const catalogo = {

"Estribos":[
"EST001 - Estribo 11x17 4.2mm",
"EST002 - Estribo 12x27 4.2mm",
"EST003 - Estribo 7x17 4.2mm",
"EST004 - Estribo 17x17 4.2mm",
"EST005 - Estribo 27x27 4.2mm",
"EST006 - Estribo 7x14 4.2mm",
"EST007 - Estribo 12x27 5mm",
"EST008 - Estribo 7x14 5mm",
"EST009 - Estribo 11x17 5mm",
"EST010 - Estribo 7x17 5mm"
],

"Argamassas":[
"ARG001 - Argamassa Precon ACI Cinza",
"ARG002 - Argamassa Precon ACII Cinza",
"ARG003 - Argamassa Precon ACIII Cinza",
"ARG004 - Argamassa Porcelanato Interno",
"ARG005 - Argamassa Refratária 20kg",
"ARG006 - Argamassa Projetada 40kg",
"ARG007 - Argamassa Precon ACIII Branca"
],

"Pregos":[
"PRG001 - Prego Ardox SC 17x21 2x11",
"PRG002 - Prego CCAB 12x12 Gerdau",
"PRG003 - Prego CCAB 15x15 1.1/4x13 Gerdau",
"PRG004 - Prego CCAB 17x21 2x11 Gerdau",
"PRG005 - Prego CCAB 18x30 2.3/4x10 Gerdau",
"PRG006 - Prego CCAB 19x36 Gerdau",
"PRG007 - Prego 20x48 Gerdau",
"PRG008 - Prego 22x48 Gerdau",
"PRG009 - Prego 19x11 Gerdau"
],

"Treliças":[
"TRL001 - Treliça Média TR8-633 12M",
"TRL002 - Treliça Média TR8-633 6M",
"TRL003 - Treliça Pesada TR12-644 6M",
"TRL004 - Treliça Leve TR8-533 6M",
"TRL005 - Treliça Média TR12-644 12M",
"TRL006 - Treliça Pesada TR8-644 6M"
],

"Arames":[
"ARM001 - BOB ARAME REC 3,40MM LISO BWG10 (PG18)",
"ARM002 - BOB ARAME REC 2,77MM LISO BWG12 (PG16)",
"ARM003 - BOB ARAME REC 2,10MM LISO BWG14 (PG14)",
"ARM004 - BOB ARAME REC 1,65MM LISO BWG16 (PG12)",
"ARM005 - BOB ARAME REC 1,24 REC TORC BWG18 (PG7)",
"ARM006 - BOB ARAME REC LISO BWG18 (PG7)"
],

"Kit Arame":[
"KIT001 - KIT 10X ARAME REC 1,24MM TORC BWG18 (PG7)",
"KIT002 - KIT 10X ARAME REC 1,24 LISO BWG18 (PG7)",
"KIT003 - KIT 10X ARAME REC 1,65 LISO BWG16 (PG12)",
"KIT004 - KIT 10X ARAME REC 2,10MM LISO BWG14 (PG14)",
"KIT005 - KIT 10X ARAME REC 2,77MM LISO BWG12 (PG16)",
"KIT006 - KIT 10X ARAME REC 3,40MM LISO BWG10 (PG18)"
]

};

let carrinho=[];

function carregarCategorias(){

let area=document.getElementById("categorias");

area.innerHTML="";

for(let c in catalogo){

area.innerHTML+=`<button class="categoria" onclick="abrirCategoria('${c}')">${c}</button>`;

}

}

function abrirCategoria(cat){

let area=document.getElementById("produtos");

area.classList.remove("hidden");

area.innerHTML=`<button onclick="fechar()">⬅ Voltar</button><h2>${cat}</h2>`;

catalogo[cat].forEach(p=>{

area.innerHTML+=`

<div class="produto">

${p}

<input type="number" placeholder="Quantidade" id="${p}">

<button onclick="add('${p}')">Adicionar</button>

</div>

`;

});

}

function fechar(){

document.getElementById("produtos").classList.add("hidden");

}

function add(prod){

let q=document.getElementById(prod).value;

if(!q)return;

carrinho.push(prod+" - "+q);

mostrarCarrinho();

}

function mostrarCarrinho(){

let lista=document.getElementById("listaCarrinho");

lista.innerHTML="<h4>Produtos selecionados:</h4>";

carrinho.forEach(i=>{

lista.innerHTML+=`<div class="carrinhoItem">✔ ${i}</div>`;

});

document.getElementById("contador").innerText=carrinho.length;

}

function enviar(){

let obs=document.getElementById("obs").value;

let msg="Cotação:%0A%0A";

carrinho.forEach(i=>{

msg+=i+"%0A";

});

msg+="%0AObservação:%0A"+obs;

window.open("https://wa.me/?text="+msg);

}

function buscarProduto(){

let termo=document.getElementById("busca").value.toLowerCase();

let area=document.getElementById("produtos");

area.classList.remove("hidden");

area.innerHTML="<h2>Resultados</h2>";

for(let cat in catalogo){

catalogo[cat].forEach(p=>{

if(p.toLowerCase().includes(termo)){

area.innerHTML+=`

<div class="produto">

${p}

<input type="number" placeholder="Quantidade" id="${p}">

<button onclick="add('${p}')">Adicionar</button>

</div>

`;

}

});

}

}

carregarCategorias();

</script>

</body>
</html>
