<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
}

.grid-produtos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.card-produto{
background:white;
border-radius:12px;
padding:10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
cursor:pointer;
}

.card-produto img{
width:100%;
height:80px;
object-fit:contain;
}

.card-produto span{
font-weight:bold;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
}

.tabelaProdutos td{
padding:10px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
}

#carrinho{
background:white;
padding:15px;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
}

.whatsapp{
background:#25D366;
color:white;
padding:12px;
width:100%;
margin-top:10px;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="grid-produtos"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">
<h3>Carrinho (<span id="contador">0</span>)</h3>
<div id="listaCarrinho"></div>
<textarea id="obs" placeholder="Observações"></textarea>
<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>
</div>

</div>

<script>

const numero="5531986580180";

const catalogo={
"Estribos":["EST001 - Estribo 11x17 4.2mm"],
"Argamassas":["ARG001 - Argamassa Precon ACII Cinza"],
"Pregos":["PRG001 - Prego"],
"Treliças":["TRL001 - Treliça"],
"Arames":["ARM001 - Arame"],
"Kit Arame":["KIT001 - Kit"],
"Malhas":["MLP001 - Malha"],
"Colunas":["COL001 - Coluna"],
"Vergalhoes":["VRG001 - Vergalhão"]
};

let carrinho=[];

function carregarCategorias(){
let area=document.getElementById("categorias");

area.innerHTML=`

<div class="card-produto" onclick="abrirCategoria('Estribos')">
<img src="https://cdn-icons-png.flaticon.com/512/2933/2933245.png">
<span>Estribos</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Argamassas')">
<img src="data:image/jpeg;base64,${btoa('ARGAMASSA_PRECON_PLACEHOLDER')}">
<span>Argamassas</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Pregos')">
<img src="https://cdn-icons-png.flaticon.com/512/809/809957.png">
<span>Pregos</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Treliças')">
<img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">
<span>Treliças</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Arames')">
<img src="https://cdn-icons-png.flaticon.com/512/1995/1995513.png">
<span>Arames</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Kit Arame')">
<img src="https://cdn-icons-png.flaticon.com/512/1995/1995513.png">
<span>Kit Arame</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Malhas')">
<img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">
<span>Malhas</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Colunas')">
<img src="https://cdn-icons-png.flaticon.com/512/2942/2942923.png">
<span>Colunas</span>
</div>

<div class="card-produto" onclick="abrirCategoria('Vergalhoes')">
<img src="https://cdn-icons-png.flaticon.com/512/2942/2942923.png">
<span>Vergalhões</span>
</div>
`;
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>`;
});
}

function buscarProduto(){}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
}

function enviar(){
window.open("https://wa.me/"+numero);
}

carregarCategorias();

</script>

</body>
</html>
