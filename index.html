<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

header{
background:black;
text-align:center;
padding:20px;
}

header img{
width:260px;
max-width:80%;
}

header h1{
color:#e30613;
margin:5px 0;
font-size:28px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:none;
font-size:16px;
}

button{
background:#e30613;
color:white;
border:none;
padding:12px;
border-radius:8px;
margin-top:6px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

button:hover{
background:#ff2c2c;
}

.categoria{
background:#1c1c1c;
margin-top:20px;
padding:15px;
border-radius:10px;
}

.produto{
background:#2a2a2a;
padding:10px;
margin-top:10px;
border-radius:8px;
}

#resumo{
background:black;
padding:20px;
margin-top:30px;
border-radius:10px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>

<img src="logo_512.png">

<h1>MULTIPLA COTAÇÃO</h1>

</header>

<div class="container">

<div id="cliente">

<input id="nome" placeholder="Nome do cliente">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">

<button onclick="iniciar()">INICIAR COTAÇÃO</button>

</div>

<div id="produtos" class="hidden"></div>

<div id="resumo" class="hidden">

<h2>Resumo da Cotação</h2>

<div id="listaResumo"></div>

<h3>Observações</h3>

<textarea id="observacao" placeholder="Digite observações do pedido aqui"></textarea>

<button onclick="enviar()">ENVIAR NO WHATSAPP</button>

<button onclick="voltar()">VOLTAR</button>

</div>

</div>

<script>

const catalogo={

"Estribos":[
"EST001 Estribo 11x17 4.2",
"EST002 Estribo 12x27 4.2",
"EST003 Estribo 7x17 4.2",
"EST004 Estribo 10x20 4.2",
"EST005 Estribo 15x30 4.2"
],

"Treliças":[
"TR001 Treliça TR8 6m",
"TR002 Treliça TR8 12m",
"TR003 Treliça H8",
"TR004 Treliça H12"
],

"Pregos":[
"PR001 Prego Ardox 17x21",
"PR002 Prego Ardox 18x27",
"PR003 Prego 12x12",
"PR004 Prego 15x15"
],

"Argamassas":[
"AR001 Argamassa AC1",
"AR002 Argamassa AC2",
"AR003 Argamassa AC3",
"AR004 Argamassa Piso sobre Piso"
],

"Arames":[
"ARM001 Arame recozido 1kg",
"ARM002 Arame recozido 25kg",
"ARM003 Arame galvanizado"
],

"Vergalhões":[
"VR001 Vergalhão CA60 4.2",
"VR002 Vergalhão CA60 5mm",
"VR003 Vergalhão CA50 8mm",
"VR004 Vergalhão CA50 10mm"
]

};

let carrinho=[];

function iniciar(){

document.getElementById("cliente").style.display="none";

document.getElementById("produtos").classList.remove("hidden");

mostrarProdutos();

}

function mostrarProdutos(){

const area=document.getElementById("produtos");

area.innerHTML="";

for(let categoria in catalogo){

let bloco=document.createElement("div");

bloco.className="categoria";

bloco.innerHTML="<h3>"+categoria+"</h3>";

catalogo[categoria].forEach(prod=>{

let item=document.createElement("div");

item.className="produto";

item.innerHTML=`

<label>${prod}</label>

<input type="number" min="1" placeholder="Quantidade" id="${prod}">

<button onclick="adicionar('${prod}')">ADICIONAR</button>

`;

bloco.appendChild(item);

});

area.appendChild(bloco);

}

}

function adicionar(prod){

let qtd=document.getElementById(prod).value;

if(!qtd) return;

carrinho.push({produto:prod,quantidade:qtd});

atualizarResumo();

}

function atualizarResumo(){

const lista=document.getElementById("listaResumo");

lista.innerHTML="";

carrinho.forEach(item=>{

lista.innerHTML+=`<p>${item.produto} - ${item.quantidade}</p>`;

});

document.getElementById("resumo").classList.remove("hidden");

}

function enviar(){

let nome=document.getElementById("nome").value;

let cidade=document.getElementById("cidade").value;

let obs=document.getElementById("observacao").value;

let mensagem="Cotação - "+nome+" ("+cidade+")%0A%0A";

carrinho.forEach(item=>{

mensagem+=item.produto+" - "+item.quantidade+"%0A";

});

mensagem+="%0AObservação:%0A"+obs;

window.open("https://wa.me/?text="+mensagem);

}

function voltar(){

location.reload();

}

</script>

</body>
</html>
