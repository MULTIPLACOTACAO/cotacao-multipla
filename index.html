<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_512.png">
<link rel="apple-touch-icon" href="logo_512.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multipla Cotação</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
color:#333;
}

header{
background:#2c3e50;
color:white;
padding:10px 20px;
font-size:26px;
font-weight:bold;
display:flex;
align-items:center;
gap:15px;
}

header img{
height:70px;
object-fit:contain;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.searchBox{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchBox input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

.searchBox button{
padding:12px 20px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.categorias{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.categoria{
background:white;
border:1px solid #ddd;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

.tabelaProdutos{
background:white;
border-radius:6px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.tabelaProdutos table{
width:100%;
border-collapse:collapse;
}

.tabelaProdutos th{
background:#34495e;
color:white;
padding:12px;
text-align:left;
}

.tabelaProdutos td{
padding:10px;
border-bottom:1px solid #eee;
}

.tabelaProdutos input{
width:80px;
padding:5px;
}

.btnAdd{
background:#27ae60;
color:white;
border:none;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

#carrinho{
background:white;
border-radius:6px;
padding:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.itemCarrinho{
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
padding:6px 0;
}

.remover{
background:#e74c3c;
color:white;
border:none;
border-radius:4px;
padding:4px 8px;
cursor:pointer;
}

.limpar{
margin-top:10px;
background:#7f8c8d;
color:white;
border:none;
padding:8px;
border-radius:4px;
width:100%;
cursor:pointer;
}

.whatsapp{
margin-top:10px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
cursor:pointer;
}

.install{
margin-top:10px;
background:#ff9800;
color:white;
border:none;
padding:12px;
border-radius:6px;
width:100%;
font-size:16px;
cursor:pointer;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

/* NOVO BLOCO CLIENTE */
.dadosCliente input{
width:100%;
padding:10px;
margin-bottom:8px;
border-radius:6px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<header>
<img src="/logo_512.png">
MULTIPLA COTAÇÃO
</header>

<div class="container">

<!-- NOVO: DADOS DO CLIENTE -->
<div class="dadosCliente">
<input id="nome" placeholder="Nome do cliente">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">
</div>

<div class="searchBox">
<input id="busca" placeholder="Buscar produto" oninput="buscarProduto()">
<button onclick="buscarProduto()">Buscar</button>
</div>

<div id="categorias" class="categorias"></div>

<div class="tabelaProdutos">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th></th>
</tr>
</thead>
<tbody id="produtos"></tbody>
</table>
</div>

<div id="carrinho">

<h3>Carrinho (<span id="contador">0</span>)</h3>

<div id="listaCarrinho"></div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="limpar" onclick="limparCarrinho()">Limpar Pedido</button>

<button class="whatsapp" onclick="enviar()">Enviar Cotação no WhatsApp</button>

<button id="installBtn" class="install" style="display:none">Baixar App</button>

</div>

</div>

<script>

const numero="5531986580180";

const catalogo = {

"Estribos":[
"EST001 - Estribo 11x17 4.2mm",
"EST002 - Estribo 12x27 4.2mm"
],

"Argamassas":[
"ARG001 - Argamassa Precon ACII Cinza"
],

"Pregos":[
"PRG001 - Prego Gerdau 17x21"
],

"Treliças":[
"TRL001 - Treliça TR8"
],

"Arames":[
"ARM001 - Arame BWG18"
],

"Kit Arame":[
"KIT001 - Kit Arame 10x"
],

"Malhas":[
"MLP001 - Malha Pop"
],

"Colunas":[
"COL001 - Coluna 6m"
],

"Vergalhoes":[
"VRG001 - Vergalhão CA50"
]

};

let carrinho=[];

function carregarCategorias(){
let area=document.getElementById("categorias");
for(let c in catalogo){
area.innerHTML+=`<div class="categoria" onclick="abrirCategoria('${c}')">${c}</div>`;
}
}

function abrirCategoria(cat){
let area=document.getElementById("produtos");
area.innerHTML="";
catalogo[cat].forEach(p=>{
area.innerHTML+=`
<tr>
<td>${p}</td>
<td><input type="number" id="${p}"></td>
<td><button class="btnAdd" onclick="add('${p}')">Adicionar</button></td>
</tr>
`;
});
}

function buscarProduto(){
let termo=document.getElementById("busca").value.toLowerCase();
let area=document.getElementById("produtos");
area.innerHTML="";

for(let categoria in catalogo){
catalogo[categoria].forEach(produto=>{
if(produto.toLowerCase().includes(termo)){
area.innerHTML+=`
<tr>
<td>${produto}</td>
<td><input type="number" id="${produto}"></td>
<td><button class="btnAdd" onclick="add('${produto}')">Adicionar</button></td>
</tr>
`;
}
});
}
}

function add(prod){
let q=document.getElementById(prod).value;
if(!q)return;
carrinho.push(prod+" - "+q);
mostrarCarrinho();
}

function mostrarCarrinho(){
let lista=document.getElementById("listaCarrinho");
lista.innerHTML="";
carrinho.forEach((i,index)=>{
lista.innerHTML+=`<div class="itemCarrinho">${i}<button class="remover" onclick="remover(${index})">X</button></div>`;
});
document.getElementById("contador").innerText=carrinho.length;
}

function remover(i){
carrinho.splice(i,1);
mostrarCarrinho();
}

function limparCarrinho(){
carrinho=[];
mostrarCarrinho();
}

function enviar(){

let nome=document.getElementById("nome").value;
let cidade=document.getElementById("cidade").value;
let telefone=document.getElementById("telefone").value;

let obs=document.getElementById("obs").value;

let msg="Cotação:%0A%0A";

msg+="Nome: "+nome+"%0A";
msg+="Cidade: "+cidade+"%0A";
msg+="Telefone: "+telefone+"%0A%0A";

carrinho.forEach(i=>{ msg+=i+"%0A"; });

msg+="%0AObservação:%0A"+obs;

window.open("https://wa.me/"+numero+"?text="+msg);
}

carregarCategorias();

</script>

</body>
</html>
