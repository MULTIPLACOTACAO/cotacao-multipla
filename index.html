<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multipla Cotação</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e30613">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
color:#fff;
}
header{
background:#000;
padding:25px;
text-align:center;
color:#e30613;
font-size:28px;
font-weight:700;
letter-spacing:1px;
box-shadow:0 4px 15px rgba(0,0,0,0.6);
}
.container{
padding:20px;
max-width:1100px;
margin:auto;
}
input, textarea{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#2b2b2b;
color:#fff;
font-size:14px;
}
input:focus, textarea:focus{
outline:none;
box-shadow:0 0 0 2px #e30613;
}
button{
background:#e30613;
color:white;
border:none;
padding:14px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
width:100%;
font-weight:bold;
font-size:15px;
transition:0.3s;
}
button:hover{
background:#ff1a1a;
transform:scale(1.03);
}
.category{
background:#1c1c1c;
padding:20px;
margin-top:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.category h3{
margin-top:0;
color:#e30613;
border-bottom:1px solid #333;
padding-bottom:10px;
}
.product{
background:#2a2a2a;
padding:15px;
margin-top:12px;
border-radius:12px;
display:flex;
flex-direction:column;
gap:8px;
}
#cart{
background:#111;
padding:20px;
margin-top:35px;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,0.6);
}
#cart h3{
color:#e30613;
margin-top:0;
}
.badge{
background:#e30613;
padding:4px 8px;
border-radius:20px;
font-size:12px;
margin-left:8px;
}
.hidden{display:none;}
</style>
</head>

<body>

<header>
MULTIPLA COTAÇÃO
<span id="contador" class="badge hidden">0</span>
</header>

<div class="container">

<div id="cliente">
<input id="nome" placeholder="Nome">
<input id="cidade" placeholder="Cidade">
<input id="telefone" placeholder="Telefone">
<button onclick="iniciar()">INICIAR COTAÇÃO</button>
</div>

<div id="produtos" class="hidden"></div>

<div id="cart" class="hidden">

<h3>Resumo da Cotação</h3>
<div id="resumo"></div>

<h3>Observações do Pedido</h3>
<textarea id="observacoes" placeholder="Digite observações sobre o pedido ou informações da obra"></textarea>

<br>

<label>
<input type="checkbox" id="projeto"> Tenho projeto estrutural
</label>

<br><br>

<input type="file" id="arquivoProjeto" accept=".pdf,image/*">

<br><br>

<button onclick="enviarWhats()">ENVIAR NO WHATSAPP</button>
<button onclick="voltarInicio()">VOLTAR</button>

</div>

</div>

<script>

const catalogo = {
"Estribos":[
"EST001 - Estribo 11x17 4.2mm","EST002 - Estribo 12x27 4.2mm","EST003 - Estribo 7x17 4.2mm"
],
"Argamassas":[
"ARG001 - Argamassa Precon ACI Cinza",
"ARG002 - Argamassa Precon ACII Cinza"
],
"Pregos":[
"PRG001 - Prego Ardox SC 17x21 2x11",
"PRG002 - Prego CCAB 12x12 Gerdau"
]
};

let carrinho = [];

function iniciar(){
document.getElementById("cliente").style.display="none";
document.getElementById("produtos").classList.remove("hidden");
gerarProdutos();
}

function gerarProdutos(){
const container=document.getElementById("produtos");
container.innerHTML="";

for(let categoria in catalogo){

let div=document.createElement("div");
div.className="category";

div.innerHTML="<h3>"+categoria+"</h3>";

catalogo[categoria].forEach(prod=>{

let p=document.createElement("div");
p.className="product";

p.innerHTML=`
<label>${prod}</label>
<input type="number" min="0" placeholder="Quantidade"
onchange="addCarrinho('${prod}',this.value)">
`;

div.appendChild(p);

});

container.appendChild(div);

}
}

function addCarrinho(prod,qtd){

qtd=parseInt(qtd);

if(!qtd || qtd<=0) return;

let existente=carrinho.find(item=>item.produto===prod);

if(existente){

existente.quantidade=qtd;

}else{

carrinho.push({produto:prod,quantidade:qtd});

}

atualizarResumo();

}

function atualizarResumo(){

const resumo=document.getElementById("resumo");
const contador=document.getElementById("contador");

resumo.innerHTML="";

if(carrinho.length>0){

document.getElementById("cart").classList.remove("hidden");
contador.classList.remove("hidden");

contador.innerText=carrinho.length;

carrinho.forEach(item=>{

resumo.innerHTML+=`<p>${item.produto} - ${item.quantidade}</p>`;

});

}

}

function enviarWhats(){

let nome=document.getElementById("nome").value;
let cidade=document.getElementById("cidade").value;
let observacoes=document.getElementById("observacoes").value;
let projeto=document.getElementById("projeto").checked ? "Sim" : "Não";

let mensagem=`Olá, sou ${nome} de ${cidade}.\n\nSegue minha cotação:\n\n`;

carrinho.forEach(item=>{
mensagem+=`${item.produto} - ${item.quantidade}\n`;
});

mensagem+=`\nObservações:\n${observacoes}\nProjeto estrutural: ${projeto}`;

let numero="5531986580180";

let url=`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(url,"_blank");

}

function voltarInicio(){

document.getElementById("cliente").style.display="block";
document.getElementById("produtos").classList.add("hidden");
document.getElementById("cart").classList.add("hidden");

carrinho=[];

document.getElementById("contador").classList.add("hidden");
document.getElementById("resumo").innerHTML="";
document.getElementById("observacoes").value="";
document.getElementById("projeto").checked=false;

}

</script>

<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
